# TLS with a self-signed certificate (no certificate authority): offers VeNCrypt (19) plus RSA-AES (129, 5).
# Make the certificate with the command in README.md (its subjectAltName must name the address the viewer connects to).
address=127.0.0.1
port=5933
enable_auth=true
username=hubos
password=test-pw-NOT-A-SECRET
private_key_file=/tmp/r3-w/auth/tls2.key
certificate_file=/tmp/r3-w/auth/tls2.crt
