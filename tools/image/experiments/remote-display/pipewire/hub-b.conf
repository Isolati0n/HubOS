# "Hub" PipeWire instance: a null sink standing for the loudspeakers, and an RTP source that receives from the node.
context.objects = [
  { factory = adapter
    args = { factory.name = support.null-audio-sink node.name = hub-out media.class = Audio/Sink
             object.linger = true audio.position = [ FL FR ] } }
]
context.modules = [
  { name = libpipewire-module-rtp-source
    args = { source.ip = 127.0.0.1 source.port = 46000 sess.latency.msec = LATMS
             stream.props = { node.name = rtp-from-a-at-hub target.object = hub-out } } }
]
