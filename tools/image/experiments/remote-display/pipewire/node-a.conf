# "Node" PipeWire instance: a null sink the node's apps would play to, and an RTP sink that sends to the hub.
context.objects = [
  { factory = adapter
    args = { factory.name = support.null-audio-sink node.name = node-null media.class = Audio/Sink
             object.linger = true audio.position = [ FL FR ] } }
]
context.modules = [
  { name = libpipewire-module-rtp-sink
    args = { destination.ip = 127.0.0.1 destination.port = 46000 net.mtu = 1280 sess.name = node-a
             sess.media = RTPMEDIA
             stream.props = { node.name = rtp-from-a } } }
]
