# BROKEN ON PURPOSE: id must start with a letter or digit.
# EXPECT: -nas: id "-nas" must start with a letter or digit, not a dash

format = 1

[[machine]]
id      = "hub"
name    = "Desk Hub"
role    = "hub"
address = "192.0.2.10"
open    = ["none"]
home    = { x = 0, y = 0 }

[[machine]]
id      = "-nas"
name    = "Storage"
role    = "nas"
address = "192.0.2.20"
open    = ["files", "ssh"]
home    = { x = -2000, y = 0 }
share   = "pool"
