# BROKEN ON PURPOSE: host is refused on every role except guest.
# EXPECT: nas-1: host is only allowed on a guest (this machine's role is "nas")

format = 1

[[machine]]
id      = "hub"
name    = "Desk Hub"
role    = "hub"
address = "192.0.2.10"
open    = ["none"]
home    = { x = 0, y = 0 }

[[machine]]
id      = "vmhost-1"
name    = "VM Host"
role    = "vm-host"
address = "192.0.2.40"
open    = ["ssh"]
home    = { x = 0, y = 1500 }

[[machine]]
id      = "nas-1"
name    = "Storage"
role    = "nas"
address = "192.0.2.20"
open    = ["files", "ssh"]
home    = { x = -2000, y = 0 }
share   = "pool"
host    = "vmhost-1"
