# BROKEN ON PURPOSE: address has no port in it.
# EXPECT: nas-1: address "192.0.2.20:445" is not a plain name or IP address (no port, slash or spaces; the port goes in "port")

format = 1

[[machine]]
id      = "hub"
name    = "Desk Hub"
role    = "hub"
address = "192.0.2.10"
open    = ["none"]
home    = { x = 0, y = 0 }

[[machine]]
id      = "nas-1"
name    = "Storage"
role    = "nas"
address = "192.0.2.20:445"
open    = ["files", "ssh"]
home    = { x = -2000, y = 0 }
share   = "pool"
