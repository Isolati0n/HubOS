# BROKEN ON PURPOSE: id must be unique.
# EXPECT: nas-1: id is not unique: machine #2 has the same id

format = 1

[[machine]]
id      = "hub"
name    = "Desk Hub"
role    = "hub"
address = "192.0.2.10"
open    = ["none"]
home    = { x = 0, y = 0 }

[[machine]]
id      = "nas-1"
name    = "Storage"
role    = "nas"
address = "192.0.2.20"
open    = ["files", "ssh"]
home    = { x = -2000, y = 0 }
share   = "pool"

[[machine]]
id      = "nas-1"
name    = "Storage copy"
role    = "nas"
address = "192.0.2.20"
open    = ["files", "ssh"]
home    = { x = -2000, y = 500 }
share   = "pool"
