# BROKEN ON PURPOSE: name, user, share, address and id must not contain control characters or line breaks.
# EXPECT: nas-1: name must not contain control characters or line breaks

format = 1

[[machine]]
id      = "hub"
name    = "Desk Hub"
role    = "hub"
address = "192.0.2.10"
open    = ["none"]
home    = { x = 0, y = 0 }

[[machine]]
id      = "nas-1"
name    = "Storage\nSecond line"
role    = "nas"
address = "192.0.2.20"
