# BROKEN ON PURPOSE: lifetime must be ephemeral or persistent.
# EXPECT: scratch-os: lifetime "forever" is not one of: ephemeral, persistent

format = 1

[[machine]]
id      = "hub"
name    = "Desk Hub"
role    = "hub"
address = "192.0.2.10"
open    = ["none"]
home    = { x = 0, y = 0 }

[[machine]]
id      = "vmhost-1"
name    = "VM Host"
role    = "vm-host"
address = "192.0.2.40"
open    = ["ssh"]
home    = { x = 0, y = 1500 }

[[machine]]
id       = "scratch-os"
name     = "Scratch OS (test guest)"
role     = "guest"
address  = "192.0.2.41"
open     = ["spice"]
home     = { x = 2000, y = 1500 }
host     = "vmhost-1"
lifetime = "forever"
