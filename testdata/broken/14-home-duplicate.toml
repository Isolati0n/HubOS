# BROKEN ON PURPOSE: two machines may not share the same home.
# EXPECT: nas-1: home (x = 0, y = 0) is already used by hub

format = 1

[[machine]]
id      = "hub"
name    = "Desk Hub"
role    = "hub"
address = "192.0.2.10"
open    = ["none"]
home    = { x = 0, y = 0 }

[[machine]]
id      = "nas-1"
name    = "Storage"
role    = "nas"
address = "192.0.2.20"
open    = ["files", "ssh"]
home    = { x = 0, y = 0 }
share   = "pool"
