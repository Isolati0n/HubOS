# Hub OS test inventory. Fake machines on this computer's own loopback
# addresses (127.0.0.x). Nothing here is real.
#
# Ports 21001-21007 are FAKE-NODE ports for manual runs, picked from
# 20000-29999 (this machine's ephemeral range is 32768-60999, so they do not
# collide). They are not the ports of any real viewer or server.
#
# Start fake nodes with tools/fakenode, for example:
#   fakenode 127.0.0.11:21001 127.0.0.12:21002 127.0.0.14:21004
# Machines whose fake node is not running show as DOWN.
# desktop-1 has no port on purpose, so it shows as NOT CHECKED.
#
# Automated tests do not use this file's ports. They build their own
# inventory at run time with ports the operating system hands out.

format = 1

[[machine]]
id      = "hub"
name    = "Desk Hub"
role    = "hub"
address = "127.0.0.10"
open    = ["none"]
home    = { x = 0, y = 0 }

[[machine]]
id      = "gaming-1"
name    = "Gaming Box"
role    = "gaming"
address = "127.0.0.11"
open    = ["moonlight"]
home    = { x = -2000, y = -1500 }
port    = 21001

[[machine]]
id      = "ai-1"
name    = "AI Box"
role    = "ai"
address = "127.0.0.12"
open    = ["moonlight", "ssh"]
home    = { x = 2000, y = -1500 }
port    = 21002
user    = "owner"

[[machine]]
id      = "desktop-1"
name    = "General Desktop"
role    = "desktop"
address = "127.0.0.13"
open    = ["moonlight"]
home    = { x = 2000, y = 0 }

[[machine]]
id      = "nas-1"
name    = "Storage"
role    = "nas"
address = "127.0.0.14"
open    = ["files", "ssh"]
home    = { x = -2000, y = 0 }
port    = 21004
user    = "owner"
share   = "pool"

[[machine]]
id      = "backup-nas-1"
name    = "Backup Storage"
role    = "backup-nas"
address = "127.0.0.15"
open    = ["files"]
home    = { x = -2000, y = 1500 }
port    = 21005
share   = "backup"

[[machine]]
id      = "vmhost-1"
name    = "VM Host"
role    = "vm-host"
address = "127.0.0.16"
open    = ["ssh"]
home    = { x = 0, y = 1500 }
port    = 21006
user    = "owner"

[[machine]]
id       = "scratch-os"
name     = "Scratch OS (test guest)"
role     = "guest"
address  = "127.0.0.17"
open     = ["spice"]
home     = { x = 2000, y = 1500 }
port     = 21007
host     = "vmhost-1"
lifetime = "ephemeral"
