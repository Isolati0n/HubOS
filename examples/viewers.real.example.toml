# Hub OS viewers table — REAL VIEWERS EXAMPLE. EVERY ENTRY IS UNVERIFIED ON
# HARDWARE: none of these commands has been run against a real machine. They
# are the command shapes the owner chose after docs/viewers-research.md; what
# was and was not tested is written next to each entry.
#
# Copy to /etc/hubos/viewers.toml (next to the inventory) to use it. No secret
# ever goes in this file. The fake viewer used by the tests is in
# examples/viewers.example.toml; this file is not used by the tests except to
# check that it loads, validates and renders the argument lists below.
#
# Placeholders: {id} {name} {address} {port} {user} {share} {session}
#   {app_id} (hubos-<id>)  {title} (the machine's name)
# {port} is the machine's port from the inventory, or the [default_ports]
# entry for the machine's first "open" entry; a machine with neither cannot
# be opened with a command that uses {port}. {session} is the inventory's
# "session" (the Sunshine app name). [default_ports] is also the port of the
# up/down check for a machine that has no port of its own.

format = 1

# ---- default ports ----
# UNVERIFIED on hardware. These ports come from docs/viewers-research.md
# (Sunshine's main port 47989, the standard ssh port 22, the standard SMB port
# 445); none was tried against a real machine. There is deliberately NO entry
# for spice and vnc: a VM guest's console port is chosen per guest, so the
# inventory gives it. A machine with no port of its own and no entry here is
# "not checked".
[default_ports]
moonlight = 47989
ssh       = 22
files     = 445

# ---- ssh: a terminal (foot) running ssh, with tmux on the machine ----
# UNVERIFIED on hardware. Tested here: the file loads, the argument list is
# right, and `ssh -G` (OpenSSH's "print the settings, do not connect") reads
# the arguments as intended. NOT tested: the tmux part (it needs a real
# server); that closing the window leaves the tmux session alive is the
# expected behaviour of tmux, not something proven here.
# foot sets its own window name (--app-id) and title. --hold keeps the window
# open when ssh fails, so the error stays readable (without it the window
# vanishes at once; docs/viewers-research.md). The inventory entry needs a
# "user". "--" stops ssh reading the address as an option.
[[viewer]]
id           = "ssh"
programs     = ["ssh"]
command      = ["foot", "--app-id={app_id}", "--title={title}", "--hold", "--", "ssh", "-p", "{port}", "-l", "{user}", "-t", "--", "{address}", "tmux", "new-session", "-A", "-s", "hubos"]
sets_name    = true

# ---- spice: a VM guest's console in remote-viewer (virt-viewer) ----
# UNVERIFIED on hardware (remote-viewer was run only against a fake address
# under a nested compositor). No [default_ports] entry: a guest's console port is
# set per guest, so the inventory gives it. If the connection fails, remote-viewer
# shows a small error dialog that carries the chosen name (HUB-OS.md,
# "Unverified").
[[viewer]]
id        = "spice"
programs  = ["spice"]
command   = ["remote-viewer", "--name={app_id}", "--title={title}", "--", "spice://{address}:{port}"]
sets_name = true

# ---- vnc: a VM guest's console in remote-viewer (virt-viewer) ----
# UNVERIFIED on hardware, same as spice. No [default_ports] entry.
[[viewer]]
id        = "vnc"
programs  = ["vnc"]
command   = ["remote-viewer", "--name={app_id}", "--title={title}", "--", "vnc://{address}:{port}"]
sets_name = true

# ---- moonlight: a Sunshine machine in Moonlight (moonlight-qt) ----
# UNVERIFIED on hardware, and Moonlight was never run: the window title
# "<id> - Moonlight" is read from its source code, and it needs Sunshine's
# name on the node to be set to the machine id. Moonlight cannot set its
# window name per window, so the window is found by its exact title
# (title_match) and recorded as matched by "title". The inventory entry needs
# a "session" (the Sunshine app to stream). window_wait and late_grace are
# guesses for a stream that takes a while to start.
[[viewer]]
id           = "moonlight"
programs     = ["moonlight"]
command      = ["moonlight", "stream", "{address}", "{session}", "--display-mode", "windowed", "--no-quit-after", "--capture-system-keys", "never"]
sets_name    = false
title_match  = "{id} - Moonlight"
window_wait  = "30s"
late_grace   = "60s"
