# Hub OS viewers table — EXAMPLE ONLY: the fake viewer, nothing real.
# Lives next to the inventory (default /etc/hubos/viewers.toml); never in git
# with real content, and never any secret. Format: docs/hubd-slice2.md
#
# Each command is a LIST of arguments, started directly (no shell). Text from
# the inventory is put into one argument only. Placeholders:
#   {id} {name} {address} {port} {user} {share}   from the inventory
#   {app_id}  the window name hubd asks for: hubos-<id>
#   {title}   the machine's name
# A placeholder for a value the machine lacks (for example {port} on a
# machine with no port) stops that machine from opening; hubd never guesses.
#
# Safety tip: put "--" before the arguments that come from the inventory
# ({name}, {address}, {user}, {share}, ...) when the viewer supports it, so a
# value can never be read as an option. (The inventory already refuses an
# address, user or share that starts with a dash; "--" is the second lock.)
# The fake viewer below uses "--" before its own command.
#
# There are NO real Moonlight, virt-viewer or Remmina command lines here:
# their command lines and window names are still unknown (HUB-OS.md,
# "Unverified"). The fake viewer is a terminal window that just sits there.

format = 1

[[viewer]]
id        = "fake"
programs  = ["moonlight", "spice", "vnc", "ssh", "files"]
command   = ["foot", "--app-id={app_id}", "--title={title}", "--", "sleep", "infinity"]
sets_name = true
